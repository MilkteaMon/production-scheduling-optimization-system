name: Production Scheduling Optimization System verification

on:
  push:
    paths: ['backend/**', 'frontend/**', 'experiments/**', 'scripts/opspilot_*', 'Dockerfile', 'compose.yaml', '.github/workflows/opspilot.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'experiments/**', 'scripts/opspilot_*', 'Dockerfile', 'compose.yaml', '.github/workflows/opspilot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: python -m uv sync --project backend --locked --extra dev
      - run: python -m uv run --project backend --extra dev pytest backend/tests -q
      - run: python -m uv run --project backend --extra dev ruff check --config backend/pyproject.toml backend experiments scripts/opspilot_*.py
      - run: python -m uv run --project backend python scripts/opspilot_openapi.py
      - run: git diff --exit-code -- backend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: python -m uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api && git diff --exit-code -- src/api/schema.d.ts
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise desktop/mobile workflows with an isolated database
        run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: opspilot-browser-diagnostics
          path: frontend/test-results/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the complete container
        shell: bash
        run: |
          docker build -t opspilot:ci .
          docker run -d --name opspilot-ci -p 127.0.0.1:8000:8000 opspilot:ci
          trap 'docker logs opspilot-ci; docker rm -f opspilot-ci' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/
          docker exec opspilot-ci backend/.venv/bin/python -c "from opspilot.scheduling.milp import solver_available; assert solver_available()"
          docker exec opspilot-ci backend/.venv/bin/python -c "from opspilot.domain.models import Job, PlanningInput; from opspilot.scheduling.milp import optimize; result=optimize(PlanningInput(jobs=[Job(job_id='A',processing_time_min=3,release_time_min=0,due_time_min=2,priority_weight=1),Job(job_id='B',processing_time_min=2,release_time_min=0,due_time_min=2,priority_weight=3)],machine_count=1),10); assert result.proven_optimal and result.metrics.total_weighted_tardiness==3"
