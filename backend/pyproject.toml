[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "Verified production scheduling and evidence-grounded operations intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "pydantic-settings>=2.7",
  "sqlalchemy>=2.0,<3", "alembic>=1.14", "pandas==2.3.3", "numpy>=2.2",
  "pulp[cbc]==4.0.0", "python-multipart>=0.0.20", "psutil>=6", "openai-agents>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.28", "ruff>=0.11", "pip-tools>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opspilot"]
known-third-party = ["alembic"]
